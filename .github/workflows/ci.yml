name: CI

# Runs on every pull request and on every push to main.
#
# Continuous deployment: Render's auto-deploy is set to "After CI checks
# pass", so it deploys a main commit only when every job below succeeded.
# On main the last job migrates the production database, so the schema is
# always ready before the new version goes live:
#
#   tests + image build ──> publish image (GHCR) + migrate Neon ──> Render deploys
#                                                                (only if /health is ok)
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the older run. On main
# runs are never cancelled, so a database migration can't stop halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  IMAGE: ghcr.io/carl-castell/hunt-hub

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Lint (ESLint, backend and web)
        run: npm run lint

      - name: Backend - type check and build
        working-directory: backend
        run: npx tsc --noEmit && npm run build

      - name: Web - type check and build
        working-directory: web
        run: npm run build

      - name: Mobile - type check
        working-directory: mobile
        run: npx tsc --noEmit

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Backend - unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Backend - worker tests
        working-directory: backend
        run: npm run test:workers

      - name: Web - unit tests
        working-directory: web
        run: npm test

      - name: Mobile - unit tests
        working-directory: mobile
        run: npm test -- --ci

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hunt-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container starts and /health answers 200)
        run: |
          docker run -d --name app --network host \
            -e SESSION_SECRET=ci-only-session-secret-at-least-32-chars \
            -e DB_PROVIDER=local \
            -e LOCAL_DATABASE_URL=postgres://app:app@localhost:5432/appdb \
            -e MAIL_FROM=ci@example.com \
            -e MAIL_PROVIDER=local \
            hunt-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "The container did not become healthy:"
          docker logs app
          exit 1

      - name: Graceful shutdown (SIGTERM, clean exit)
        run: |
          docker stop app
          docker logs app | grep "shutdown complete"
          test "$(docker inspect app --format '{{.State.ExitCode}}')" = "0"


  release:
    name: Publish image and migrate production database
    # Only for main, and only after every other job passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, unit, integration, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production secrets live in the "production" environment.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same Dockerfile and build cache as the tested image (fast), tagged
      # with the commit; "latest" always points to a fully tested commit.
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      # Runs the migrations contained in exactly this image.
      - name: Apply migrations to Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::The secret NEON_DATABASE_URL is missing in the 'production' environment."
            exit 1
          fi
          docker run --rm \
            -e DB_PROVIDER=neon \
            -e NEON_DATABASE_URL \
            "$IMAGE:${{ github.sha }}" \
            node dist/src/db/migrate.js

  integration:
    name: Integration and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same image and credentials as db_test in backend/docker-compose.yml
      db_test:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Catches any email that is not mocked in a test
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-only-session-secret
      MAIL_PROVIDER: local
      MAIL_FROM: ci@example.com
      DOMAIN: http://localhost:3000
      STORAGE_PROVIDER: minio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Integration tests
        working-directory: backend
        run: npm run test:integration

      - name: End-to-end tests
        working-directory: backend
        run: npm run test:e2e
