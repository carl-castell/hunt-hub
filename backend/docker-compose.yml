# Local development services. Start what you need, e.g.:
#   docker compose up -d db db_test mailpit storage storage_init   # for `npm run dev`
#   docker compose --profile app up -d --build                    # the whole app in Docker (http://localhost:3001)
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "appdb"]
      interval: 5s
      retries: 20

  db_test:
    image: postgis/postgis:16-3.4
    container_name: local_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb_test
    ports:
      - "5434:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "appdb_test"]
      interval: 5s
      retries: 20

  # S3-compatible file storage (replaces MinIO, whose images are no longer
  # published). Same API, port and credentials as before, so the backend's
  # MINIO_* settings stay unchanged.
  storage:
    image: rustfs/rustfs:1.0.4
    container_name: local_storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000" # S3 API
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket once the storage is ready.
  storage_init:
    image: amazon/aws-cli:2.40.2
    container_name: local_storage_init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: eu-west-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://storage:9000 s3 mb s3://hunt-hub 2>/dev/null || true;
      echo 'Storage bucket ready.';
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: local_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      # The image has no curl; Mailpit ships its own readiness check.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The production image (repo-root Dockerfile) with the local services above,
  # behind the nginx load balancer below (http://localhost:3001).
  # Only started with `--profile app`, so `docker compose up` for development
  # does not build it. APP_INSTANCES sets how many instances run (default 1):
  #   APP_INSTANCES=3 docker compose --profile app up -d --build
  app:
    profiles: [app]
    build:
      context: ..
      dockerfile: Dockerfile
    image: hunt-hub:local
    deploy:
      replicas: ${APP_INSTANCES:-1}
    depends_on:
      db:
        condition: service_healthy
      storage_init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    # No host port: the load balancer (lb) is the way in.
    environment:
      # http on localhost: production mode would require https for the session cookie.
      NODE_ENV: development
      # X-Instance header and /health "instance" field, to see which replica answered.
      SHOW_INSTANCE: "true"
      # Rate limiting off for the load test (scripts/scale-benchmark.ts), only when
      # started with LOAD_TEST=true; the server refuses it with any database but the local one.
      LOAD_TEST: ${LOAD_TEST:-false}
      DOMAIN: http://localhost:3001
      SESSION_SECRET: local-docker-session-secret-at-least-32-chars
      DB_PROVIDER: local
      LOCAL_DATABASE_URL: postgres://app:app@db:5432/appdb
      MAIL_PROVIDER: local
      MAIL_HOST: mailpit
      MAIL_FROM: hunt-hub@localhost
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://storage:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: hunt-hub
      MINIO_REGION: eu-west-1

  # Round-robin load balancer in front of every app replica (loadbalancer/nginx.conf).
  lb:
    profiles: [app]
    image: nginx:1.27-alpine
    container_name: local_lb
    depends_on:
      - app
    ports:
      - "3001:80" # 3000 stays free for `npm run dev`
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
  db_test_data:
  storage_data:
