# Local load balancer for the scaling demo (docker compose --profile app).
# Spreads requests over every replica of the "app" service in turn
# (round robin), without sticky sessions: any instance must be able to
# serve any request. Not used in production (Render runs one instance).
events {}

http {
  # Docker's DNS returns one address per replica (APP_INSTANCES). Asked again
  # every 5 s, so a changed number of instances is picked up without
  # restarting the load balancer.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;
    client_max_body_size 25m; # boundary files up to 20 MB

    location / {
      set $app http://app:3000;
      proxy_pass $app;
      proxy_set_header Host $http_host;
      # One proxy in front of the app, matching app.set('trust proxy', 1):
      # every instance sees the real client IP, so rate limits are shared.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
